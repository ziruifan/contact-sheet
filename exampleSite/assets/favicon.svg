<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A square with a diagonal gradient in the colours of the example photos. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecb9a5"/>
      <stop offset="0.5" stop-color="#b9a5e3"/>
      <stop offset="1" stop-color="#97d2c4"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" fill="url(#g)"/>
</svg>
