# Example site for the contact-sheet theme: Lorem Ipsum text (千字文 on the Chinese
# pages) and a set of abstract photos.
# Preview it from the theme folder with:
#   hugo server --source exampleSite
# Or from inside exampleSite/ with: hugo server

baseURL = 'https://example.org/'
title = 'Lorem Ipsum'
theme = 'contact-sheet'
themesDir = '../..'
disableKinds = ['taxonomy', 'term']

defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[params]
  # Categories shown on the homepage and in the navigation, in this order.
  # Each is a folder under content/ (with an _index.md per language for its title).
  # Add, remove or reorder freely. Leave out this line to show every section by weight.
  categories = ['lorem', 'ipsum', 'dolor', 'amet']
  # Shown top-left and in the footer. Defaults to `title`.
  author = 'Lorem Ipsum'
  # Optional footer logo, path in assets/ or static/. Here: the favicon's contact-sheet mark.
  logo = 'favicon.svg'
  # Fallback meta description.
  description = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit.'

[languages]
  [languages.en]
    languageName = 'EN'
    languageCode = 'en'
    weight = 1
  [languages.zh]
    languageName = '中文'
    languageCode = 'zh-Hans'
    weight = 2
    title = '天地玄黄'
    [languages.zh.params]
      author = '天地玄黄'
      description = '天地玄黄，宇宙洪荒。'

# Make every page exist in every language. A page with a translation
# (index.zh.md next to index.md) uses it; a page without one falls back to the
# English text under /zh/, so the Chinese site never has missing photos.
[[module.mounts]]
  source = 'content'
  target = 'content'
  [module.mounts.sites.matrix]
    languages = ['**']
