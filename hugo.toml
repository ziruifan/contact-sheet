# passe-partout theme defaults. Site config (../../hugo.toml) overrides these.

# Tag pages need the tags taxonomy in the site config, which also drops Hugo's
# unused default `categories` taxonomy:  [taxonomies]  tag = 'tags'

[params]
  # Shown top-left in the header and in the footer copyright line.
  # Falls back to site.Title when empty.
  author = ''
  # Optional logo shown at the bottom-right of the footer.
  # Path inside assets/ or static/, e.g. 'images/logo.svg'.
  logo = ''
  # Load Ubuntu from Google Fonts. Set false to self-host or use system fonts.
  googleFonts = true
  # The "3 / 9" counter at the top of photo pages. Set false to hide it (also
  # per category with `cascade` in its _index.md, or per photo in front matter).
  photoCounter = true

[markup.goldmark.renderer]
  unsafe = false

[imaging]
  quality = 82
  resampleFilter = 'Lanczos'

[module]
  [module.hugoVersion]
    extended = false
    min = '0.153.0'
