<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default site.Language.Lang }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  {{- partial "head.html" . }}
</head>
<body class="{{ block "bodyClass" . }}{{ .Kind }}{{ end }}">
  <div class="wrap">
    {{- block "header" . }}{{ partial "header.html" . }}{{ end }}
    {{- block "main" . }}{{ end }}
    {{- block "footer" . }}{{ partial "footer.html" . }}{{ end }}
  </div>
  {{- partial "head/js.html" . }}
</body>
</html>
