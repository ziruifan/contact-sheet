# Builds exampleSite/ and publishes it to GitHub Pages:
#   https://ziruifan.github.io/passe-partout/
#
# One-time setup: in the repository, Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
name: Deploy example site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.154.5   # the theme needs ≥ 0.153 (content mounts with sites.matrix)
      HUGO_ENVIRONMENT: production
      TZ: UTC
    steps:
      - name: Install Hugo
        run: |
          wget -nv -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Resized WebP images are cached between runs, so only new or changed
      # photos are processed.
      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: exampleSite/resources
          key: hugo-resources-${{ hashFiles('exampleSite/content/**', 'exampleSite/assets/**', 'layouts/_partials/img*.html') }}
          restore-keys: hugo-resources-

      # The checkout folder is named after the repository ("passe-partout"), so
      # --themesDir ../.. lets exampleSite find this repository as its theme.
      - name: Build example site
        run: |
          hugo \
            --source exampleSite \
            --themesDir ../.. \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --destination "${{ runner.temp }}/public"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
